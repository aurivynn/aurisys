name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm gcc-multilib g++-multilib e2fsprogs

      - name: Build all stages + kernel
        run: make all

      - name: Kernel size check
        run: make size

      - name: ext4 img check
        run: make fs-check
